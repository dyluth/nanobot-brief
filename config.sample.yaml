# Daily Briefing Agent Configuration — SAMPLE FILE
# ─────────────────────────────────────────────────────────────────────────────
# Copy this to config.yaml and fill in real values.
# config.yaml is gitignored — NEVER commit it (contains private tokens).
# ─────────────────────────────────────────────────────────────────────────────

# Calendar ICS feeds — add or remove entries freely; the agent reads all of them.
# Get the private ICS URL from Google Calendar:
#   Settings → [Calendar name] → "Secret address in iCal format"
calendar_feeds:
  - https://calendar.google.com/calendar/ical/YOUR_EMAIL%40gmail.com/private-SECRETKEY/basic.ics
  - https://calendar.google.com/calendar/ical/work%40yourcompany.com/private-SECRETKEY/basic.ics

# ntfy.sh notification topic (the path component of your ntfy.sh URL)
# e.g. if your URL is https://ntfy.sh/my-daily-brief-abc123, set:
ntfy_topic: my-daily-brief-REPLACE_ME

# Logseq graph root directory (should be a git-cloned Logseq repo)
logseq_dir: /home/YOUR_USER/logseq-graph

# Journal entries: number of past days to include (uses filename date)
journal_lookback_days: 3

# Pages: how far back to scan by filesystem mtime (hours)
notes_lookback_hours: 48

# Maximum characters to return from notes (prevents overwhelming local LLM context)
max_notes_chars: 25000

# Gmail IMAP accounts (read-only, via App Passwords — NOT your Gmail login password)
# Enable 2-Step Verification, then generate an App Password at:
#   https://myaccount.google.com/apppasswords  →  Select app: Mail, Select device: Other
# Add one entry per account; remove entries you don't need.
email_accounts:
  - email: "you@gmail.com"
    app_password: "xxxx xxxx xxxx xxxx"
  # - email: "work@yourcompany.com"
  #   app_password: "xxxx xxxx xxxx xxxx"

# Local LLM backend (Ollama OpenAI-compatible endpoint)
llm_base_url: http://127.0.0.1:11434/v1
llm_model: llama3.1:8b
# Model notes:
#   llama3.1:8b  — general purpose, ~3 min/response on CPU-only hardware
#   hermes3:8b   — Llama3.1 fine-tuned for tool calling; much more reliable agent behaviour
#   llama3.2:3b  — ~3× faster on CPU, lighter quality
#
# Environment vars set in generate-briefing.sh for CPU inference:
#   NANOBOT_OPENAI_COMPAT_TIMEOUT_S=600   (nanobot default: 120 — too short for CPU)
#   NANOBOT_STREAM_IDLE_TIMEOUT_S=300     (nanobot default: 90)
